<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Ring Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scene">
      <!-- Vazi la Neon Ring inayozunguka -->
      <div class="neon-ring"></div>

      <!-- Kadi kuu ya Login na Sign Up -->
      <div class="card">
        <!-- FORM YA KWANZA: LOGIN -->
        <form class="face front">
          <h2>WELCOME</h2>
          <p>Login to your account</p>

          <input type="email" placeholder="Email Address" required />
          <input type="password" placeholder="Password" required />

          <div class="options">
            <label><input type="checkbox" /> Remember me</label>
            <a href="#">Forgot?</a>
          </div>

          <button type="submit">LOGIN</button>
          <p class="switch-text">
            Don't have an account? <a href="#" class="show-signup">Sign Up</a>
          </p>
        </form>

        <!-- FORM YA PILI: SIGN UP -->
        <form class="face back">
          <h2>SIGN UP</h2>
          <p>Create your account</p>

          <input type="text" placeholder="Full Name" required />
          <input type="email" placeholder="Email Address" required />
          <input type="password" placeholder="Password" required />

          <button type="submit">CREATE ACCOUNT</button>
          <p class="switch-text">
            Already have an account? <a href="#" class="show-login">Login</a>
          </p>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
